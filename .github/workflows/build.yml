name: Build combined images

# Two release channels (the web UI's Update tab picks one):
# - Push to main (stable): run the full test suite first, then take the next
#   vMAJOR.MINOR (minor + 1 of the newest stable tag), build, and publish a
#   GitHub release marked Latest.
# - Push to dev (dev): run the full test suite first, then publish a
#   pre-release vMAJOR.MINOR-dev.N previewing the next stable version (never
#   marked Latest), and delete all but the newest 5 dev release pages (their
#   tags stay). See scripts/release_version.py for the numbering.
# PRs: build the images as workflow artifacts (versioned by git describe).
# Put "[skip release]" in the head commit message to build without releasing.
# Pushing a v* tag by hand still releases that exact tag (a pre-release if
# the tag has a suffix, e.g. v4.24-dev.3).
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# needed so the release step can create the tag/release and attach assets
permissions:
  contents: write

# Releases run one at a time per branch, so two quick pushes can't both
# claim the same version number, and a newer push never cancels a release
# halfway through publishing (it waits; pushes queued behind it collapse
# into the newest)
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    # PRs run tests.yml on their own; branch pushes are gated here
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    needs: tests
    # tests is skipped for PRs/tags; any failure there blocks the release
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags so git describe versions the build

      - name: Resolve version from git
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          RELEASE=false
          CHANNEL=none
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$HEAD_MSG" != *"[skip release]"* && "$GITHUB_REF" == refs/heads/main ]]; then
            # Stable tags only: dev pre-release tags never bump the version
            VER=$(python3 scripts/release_version.py stable)
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$HEAD_MSG" != *"[skip release]"* && "$GITHUB_REF" == refs/heads/dev ]]; then
            # Empty when HEAD is already a stable release (main merged back)
            VER=$(python3 scripts/release_version.py dev)
            [ -n "$VER" ] && RELEASE=true
          fi
          if [ "$RELEASE" = true ]; then
            if [[ "$VER" == *-* ]]; then CHANNEL=dev; else CHANNEL=stable; fi
            PREV=$(python3 scripts/release_version.py previous "$VER")
            # The exact version goes into the firmware/UI (version.py); the
            # release step creates the tag on GitHub
            echo "WEB_VERSION_OVERRIDE=$VER" >> "$GITHUB_ENV"
          else
            VER=$(git describe --tags --always)
            PREV=
          fi
          {
            echo "VER=$VER"
            echo "RELEASE=$RELEASE"
            echo "CHANNEL=$CHANNEL"
            echo "PREV=$PREV"
          } >> "$GITHUB_ENV"
          echo "Version: $VER (release: $RELEASE, channel: $CHANNEL, notes since: ${PREV:-start})"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        # pinned to the version used for local builds — newer cores change
        # build behaviour/layout
        run: pip install "platformio==6.1.19"

      # Artifacts are copied out immediately after each build: a later pio
      # invocation can decide the environment is outdated and clean the
      # build dir, deleting the previous step's binaries.
      - name: Build firmware (both targets)
        run: |
          pio run -e esp32_wemos -e esp32_t2can
          mkdir -p out/esp32_wemos out/esp32_t2can
          cp .pio/build/esp32_wemos/bootloader.bin .pio/build/esp32_wemos/partitions.bin .pio/build/esp32_wemos/firmware.bin out/esp32_wemos/
          cp .pio/build/esp32_t2can/bootloader.bin .pio/build/esp32_t2can/partitions.bin .pio/build/esp32_t2can/firmware.bin out/esp32_t2can/

      - name: Build filesystems
        run: |
          pio run -e esp32_wemos -t buildfs
          pio run -e esp32_t2can -t buildfs
          cp .pio/build/esp32_wemos/spiffs.bin out/esp32_wemos/
          cp .pio/build/esp32_t2can/spiffs.bin out/esp32_t2can/

      - name: List build outputs
        run: find out -name '*.bin' | sort

      - name: Merge combined images
        run: |
          ESPTOOL=~/.platformio/packages/tool-esptoolpy/esptool.py
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          python "$ESPTOOL" --chip esp32 merge_bin -o "esp32_${VER}-0x000.bin" \
            0x1000   out/esp32_wemos/bootloader.bin \
            0x8000   out/esp32_wemos/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  out/esp32_wemos/firmware.bin \
            0x290000 out/esp32_wemos/spiffs.bin
          python "$ESPTOOL" --chip esp32s3 merge_bin -o "esp32s3_${VER}-0x000.bin" \
            0x0      out/esp32_t2can/bootloader.bin \
            0x8000   out/esp32_t2can/partitions.bin \
            0xe000   "$BOOT_APP0" \
            0x10000  out/esp32_t2can/firmware.bin \
            0xc90000 out/esp32_t2can/spiffs.bin
          ls -la esp32_*.bin esp32s3_*.bin

      # Combined OTA images for in-browser updates from the web interface:
      # header ("OIWEBOTA" + uint32 LE firmware len + uint32 LE filesystem len)
      # followed by firmware.bin then spiffs.bin. Unlike the 0x000 images these
      # carry no bootloader/partition table, so they're OTA-flashable.
      - name: Build OTA images (firmware + filesystem)
        run: |
          python - <<'PY'
          import struct, os
          ver = os.environ['VER']
          targets = {
              'esp32_wemos': 'esp32_%s-ota.bin' % ver,
              'esp32_t2can': 'esp32s3_%s-ota.bin' % ver,
          }
          for env, out in targets.items():
              fw = open('out/%s/firmware.bin' % env, 'rb').read()
              fs = open('out/%s/spiffs.bin' % env, 'rb').read()
              hdr = b'OIWEBOTA' + struct.pack('<II', len(fw), len(fs))
              open(out, 'wb').write(hdr + fw + fs)
              print('wrote', out, len(hdr) + len(fw) + len(fs), 'bytes')
          PY
          ls -la esp32_*-ota.bin esp32s3_*-ota.bin

      # Note: Actions artifacts always download as zips (GitHub limitation) —
      # raw .bin downloads come from release assets on v* tags
      - name: Upload esp32 OTA image
        uses: actions/upload-artifact@v7
        with:
          name: esp32_${{ env.VER }}-ota
          path: esp32_${{ env.VER }}-ota.bin
          retention-days: 30

      - name: Upload esp32s3 OTA image
        uses: actions/upload-artifact@v7
        with:
          name: esp32s3_${{ env.VER }}-ota
          path: esp32s3_${{ env.VER }}-ota.bin
          retention-days: 30

      - name: Upload esp32 image
        uses: actions/upload-artifact@v7
        with:
          name: esp32_${{ env.VER }}-0x000
          path: esp32_${{ env.VER }}-0x000.bin
          retention-days: 30

      - name: Upload esp32s3 image
        uses: actions/upload-artifact@v7
        with:
          name: esp32s3_${{ env.VER }}-0x000
          path: esp32s3_${{ env.VER }}-0x000.bin
          retention-days: 30

      # Creates the tag (at this commit) and the release if they don't exist
      # yet; a GITHUB_TOKEN-created tag doesn't re-trigger this workflow.
      # Dev releases are pre-releases and never Latest, so /releases/latest
      # (the UI's stable-channel check) only ever sees stable releases.
      # Notes start at the previous stable release for a stable one (covering
      # all its dev previews), at the previous release of either kind for dev.
      - name: Publish release
        if: env.RELEASE == 'true'
        # Third-party action with write access: pinned to a commit, not a
        # movable tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.CHANNEL == 'dev' && format('{0} (dev)', env.VER) || env.VER }}
          prerelease: ${{ env.CHANNEL == 'dev' }}
          make_latest: ${{ env.CHANNEL == 'dev' && 'false' || 'true' }}
          generate_release_notes: true
          previous_tag: ${{ env.PREV }}
          files: |
            esp32_${{ env.VER }}-0x000.bin
            esp32s3_${{ env.VER }}-0x000.bin
            esp32_${{ env.VER }}-ota.bin
            esp32s3_${{ env.VER }}-ota.bin

      # Keep the releases page short: all but the newest 5 dev pre-release
      # pages go. Only the release pages: their tags stay (dev numbering
      # counts them, and any build can still be checked out). Stable
      # releases are never touched. Never fails the release.
      - name: Prune old dev pre-releases
        if: env.RELEASE == 'true' && env.CHANNEL == 'dev'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease,isDraft \
            | python3 scripts/release_version.py prune --keep "$VER" > prune.txt
          echo "Removing $(wc -l < prune.txt) old dev release page(s)"
          while read -r tag; do
            [ -n "$tag" ] || continue
            # no --cleanup-tag: the tag stays
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done < prune.txt
