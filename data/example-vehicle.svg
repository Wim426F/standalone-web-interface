<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <!-- Car status view: a modern EV from above, nose right, on a 10x5 grid of
       100px cells. Lamps sit on cell centres so 1x1 tiles land on them:
       tail (1,1) (1,3), headlights (8,1) (8,3), charge port (8,2) -->
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d95a3"/>
      <stop offset=".22" stop-color="#d3d8df"/>
      <stop offset=".5" stop-color="#eef1f5"/>
      <stop offset=".78" stop-color="#d3d8df"/>
      <stop offset="1" stop-color="#8d95a3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2330"/>
      <stop offset=".55" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#22303f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a62"/>
      <stop offset=".5" stop-color="#8c1e26"/>
      <stop offset="1" stop-color="#ff5a62"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="body-clip"><use href="#body"/></clipPath>
    <path id="body" d="M124 250 C124 168 130 128 168 113 C200 102 232 98 270 97 C310 96 334 101 362 103
      L638 103 C668 101 694 96 734 96 C776 96 810 100 840 112 C872 126 882 168 882 250
      C882 332 872 374 840 388 C810 400 776 404 734 404 C694 404 668 399 638 397 L362 397
      C334 399 310 404 270 403 C232 402 200 398 168 387 C130 372 124 332 124 250 Z"/>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="503" cy="262" rx="392" ry="158" fill="#000" opacity=".38" filter="url(#shadow)"/>

  <!-- tyres, just showing past the arches -->
  <g fill="#15191f">
    <rect x="218" y="88" width="108" height="26" rx="10"/>
    <rect x="218" y="386" width="108" height="26" rx="10"/>
    <rect x="682" y="88" width="108" height="26" rx="10"/>
    <rect x="682" y="386" width="108" height="26" rx="10"/>
  </g>

  <!-- body -->
  <use href="#body" fill="url(#paint)" stroke="#5f6774" stroke-width="2"/>
  <g clip-path="url(#body-clip)" fill="none" stroke-linecap="round">
    <!-- shoulder highlights and panel lines -->
    <path d="M190 128 C330 118 560 116 820 128" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <path d="M190 372 C330 382 560 384 820 372" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <path d="M706 140 C744 150 800 160 852 178" stroke="#5f6774" stroke-opacity=".45" stroke-width="2"/>
    <path d="M706 360 C744 350 800 340 852 322" stroke="#5f6774" stroke-opacity=".45" stroke-width="2"/>
    <path d="M716 136 C728 200 728 300 716 364" stroke="#5f6774" stroke-opacity=".35" stroke-width="2"/>
    <path d="M206 132 C196 200 196 300 206 368" stroke="#5f6774" stroke-opacity=".35" stroke-width="2"/>
    <path d="M452 103 L452 116 M452 384 L452 397" stroke="#5f6774" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- mirrors -->
  <g fill="url(#paint)" stroke="#5f6774" stroke-width="2">
    <path d="M626 104 C622 90 626 80 640 78 L660 77 C670 77 672 86 668 94 L656 104 Z"/>
    <path d="M626 396 C622 410 626 420 640 422 L660 423 C670 423 672 414 668 406 L656 396 Z"/>
  </g>

  <!-- panoramic glass roof, windscreen to rear window -->
  <path d="M680 250 C680 168 664 134 614 128 L376 126 C322 128 288 146 274 180 C267 206 267 294 274 320
    C288 354 322 372 376 374 L614 372 C664 366 680 332 680 250 Z" fill="url(#glass)" stroke="#3c4654" stroke-width="2"/>
  <path d="M680 250 C680 168 664 134 614 128 L376 126 C322 128 288 146 274 180 C267 206 267 294 274 320
    C288 354 322 372 376 374 L614 372 C664 366 680 332 680 250 Z" fill="url(#sheen)"/>
  <!-- roof edge and B-pillar shadows -->
  <path d="M600 132 C628 190 628 310 600 368" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3"/>
  <path d="M334 130 C320 190 320 310 334 370" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3"/>

  <!-- headlights: slim LED units on the front corners -->
  <g fill="#f4f8ff" stroke="#9fb0c6" stroke-width="1.5">
    <path d="M826 132 C846 132 866 140 876 154 C880 162 878 170 872 171 C854 168 836 162 826 156 C819 148 818 138 826 132 Z"/>
    <path d="M826 368 C846 368 866 360 876 346 C880 338 878 330 872 329 C854 332 836 338 826 344 C819 352 818 362 826 368 Z"/>
  </g>
  <!-- front light bar linking them -->
  <path d="M878 182 C882 220 882 280 878 318" fill="none" stroke="#f4f8ff" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>

  <!-- charge port flap on the nose -->
  <rect x="834" y="232" width="34" height="36" rx="9" fill="none" stroke="#5f6774" stroke-width="2"/>
  <circle cx="851" cy="250" r="6" fill="none" stroke="#5f6774" stroke-width="2"/>

  <!-- tail lights: corner units and the full-width rear bar -->
  <g fill="url(#tail)" stroke="#5a1218" stroke-width="1.5">
    <path d="M132 130 C144 122 162 120 178 124 L176 138 C160 136 146 140 138 148 C134 158 134 168 136 176 L127 174 C123 158 125 142 132 130 Z"/>
    <path d="M132 370 C144 378 162 380 178 376 L176 362 C160 364 146 360 138 352 C134 342 134 332 136 324 L127 326 C123 342 125 358 132 370 Z"/>
  </g>
  <path d="M128 176 C124 220 124 280 128 324" fill="none" stroke="#e0444d" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
</svg>
